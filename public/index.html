<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도드람푸드 생산본부 김제공장 QA팀 업무현황</title><style>:root{--r:#c91532;--n:#26364c;--g:#21805a;--o:#c67b1f;--l:#e2e7ec}*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',Arial,sans-serif;background:#f4f7fa;color:#202833}.hero{padding:28px 5%;background:#fff;border-bottom:4px solid var(--r);display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:36px;margin:4px 0}.hero b{color:var(--r)}.hero p{margin:0;color:#687384}.btn{border:1px solid #ddd;background:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;padding:12px 3%;background:#fff;overflow:auto;position:sticky;top:0;z-index:5}.tab{white-space:nowrap;border:1px solid var(--l);background:#f8fafc;padding:11px 15px;border-radius:10px;font-weight:800}.tab.on{background:var(--r);color:#fff}.wrap{max-width:1500px;margin:auto;padding:24px}.page{display:none}.page.on{display:block}.title{font-size:27px;color:var(--n)}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:15px 0}.k{background:#fff;border:1px solid var(--l);border-top:4px solid var(--n);border-radius:14px;padding:17px}.k span{font-size:12px;color:#6b7280;font-weight:800}.k strong{display:block;font-size:26px;margin-top:6px}.k.done{border-top-color:var(--g)}.k.prog{border-top-color:var(--o)}.panel{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;margin:15px 0}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #d8dde4;border-radius:9px}.table{overflow:auto;max-height:620px;border:1px solid var(--l);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#f2f5f8;position:sticky;top:0}.status{padding:5px 9px;border-radius:99px;font-weight:800}.완료{background:#e8f7ef;color:#087544}.진행중{background:#fff4df;color:#9a5e00}.미정{background:#f1efff;color:#5b4db0}.empty{padding:35px;text-align:center;color:#758091}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:15px}.card h3{margin:0 0 8px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.form input,.form select,.form textarea{padding:9px;border:1px solid #ddd;border-radius:8px}.wide{grid-column:1/-1}.hide{display:none}@media(max-width:800px){.hero h1{font-size:25px}.kpis,.cards{grid-template-columns:1fr 1fr}.wrap{padding:14px}}</style></head><body><header class="hero"><div><small>DODRAM FOOD · QA TEAM</small><h1>생산본부 <b>김제공장</b></h1><p>QA팀 품질 업무현황 대시보드 · 기존 AppDeploy 데이터 이관본</p></div></header><nav class="tabs"><button class="tab on" data-p="focus">중점 진행사항 및 실적</button><button class="tab" data-p="returns">반품</button><button class="tab" data-p="quality">가공장 품질 및 위생관련 진행사항</button><button class="tab" data-p="experiment">실험</button><button class="tab" data-p="kpi">KPI 현황</button><button class="tab" data-p="audit">거래처 AUDIT 및 기관점검 현황</button><button class="tab" data-p="foreign">연간 이물 현황</button></nav><main class="wrap"><section id="focus" class="page on"><h2 class="title">중점 진행사항 및 실적</h2><div id="focusBox" class="cards"></div></section><section id="returns" class="page"><h2 class="title">반품 현황</h2><div id="returnKpi" class="kpis"></div><div class="table"><table><thead><tr><th>월</th><th>거래처/구분</th><th>품목</th><th>수량/중량</th><th>사유</th><th>금액</th></tr></thead><tbody id="returnBody"></tbody></table></div></section><section id="quality" class="page"><h2 class="title">가공장 품질 및 위생관련 진행사항</h2><div class="kpis"><div class="k"><span>총 요청</span><strong id="total">0</strong></div><div class="k done"><span>완료</span><strong id="done">0</strong></div><div class="k prog"><span>진행중</span><strong id="prog">0</strong></div><div class="k"><span>미정</span><strong id="pending">0</strong></div><div class="k"><span>완료율</span><strong id="rate">0%</strong></div></div><div class="toolbar"><input id="search" placeholder="위치·개선요청사항 검색"><select id="status"><option value="">전체</option><option>완료</option><option>진행중</option><option>미정</option></select></div><div class="table"><table><thead><tr><th>No</th><th>요청일자</th><th>완료일자</th><th>위치</th><th>추진여부</th><th>개선요청사항</th><th>비고</th></tr></thead><tbody id="qbody"></tbody></table></div></section><section id="experiment" class="page"><h2 class="title">실험</h2><div id="experimentBox" class="cards"></div></section><section id="kpi" class="page"><h2 class="title">KPI 현황</h2><div id="kpiBox" class="kpis"></div></section><section id="audit" class="page"><h2 class="title">거래처 AUDIT 및 기관점검 현황</h2><div class="table"><table><thead><tr><th>일자</th><th>구분</th><th>거래처/기관</th><th>내용</th><th>결과</th><th>부적합</th></tr></thead><tbody id="auditBody"></tbody></table></div></section><section id="foreign" class="page"><h2 class="title">연간 이물 현황</h2><div id="foreignKpi" class="kpis"></div><div class="table"><table><thead><tr><th>일자</th><th>구분</th><th>품목/거래처</th><th>이물</th><th>내용/조치</th></tr></thead><tbody id="foreignBody"></tbody></table></div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(b.dataset.p).classList.add('on')});async function api(u){const r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}function objText(o,keys){for(const k of keys)if(o?.[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return ''}function cards(el,rows){el.innerHTML=rows.length?rows.map(r=>`<div class="card"><h3>${esc(objText(r,['title','name','subject','month'])||'진행사항')}</h3><div>${esc(objText(r,['content','educationContent','hygieneContent','note','result','description'])||JSON.stringify(r))}</div></div>`).join(''):'<div class="panel empty">등록된 자료가 없습니다.</div>'}let quality=[];function renderQ(){let q=$('search').value.toLowerCase(),s=$('status').value,a=quality.filter(r=>(!s||r.status===s)&&(!q||[r.location,r.request,r.note].join(' ').toLowerCase().includes(q)));$('total').textContent=quality.length;$('done').textContent=quality.filter(x=>x.status==='완료').length;$('prog').textContent=quality.filter(x=>x.status==='진행중').length;$('pending').textContent=quality.filter(x=>x.status==='미정').length;$('rate').textContent=Math.round(quality.filter(x=>x.status==='완료').length/Math.max(1,quality.length)*100)+'%';$('qbody').innerHTML=a.sort((a,b)=>(+a.no||0)-(+b.no||0)).map(r=>`<tr><td>${esc(r.no)}</td><td>${esc(r.date)}</td><td>${esc(r.completedDate||'-')}</td><td>${esc(r.location)}</td><td><span class="status ${r.status}">${esc(r.status)}</span></td><td>${esc(r.request)}</td><td>${esc(r.note||'-')}</td></tr>`).join('')}$('search').oninput=renderQ;$('status').onchange=renderQ;async function load(){const [f,ret,q,e,k,a,fo]=await Promise.all(['/api/monthly-focus?year=2026','/api/data?year=2026','/api/quality?year=2026','/api/experiments?year=2026','/api/kpi?year=2026','/api/audits?year=2026','/api/foreign?year=2026'].map(x=>api(x).catch(()=>({rows:[]}))));cards($('focusBox'),f.rows||[]);quality=q.rows||[];renderQ();cards($('experimentBox'),e.rows||[]);const rr=ret.rows||[];$('returnKpi').innerHTML=`<div class="k"><span>반품 데이터</span><strong>${rr.length} 건</strong></div>`;$('returnBody').innerHTML=rr.map(r=>`<tr><td>${esc(objText(r,['month','date']))}</td><td>${esc(objText(r,['customer','client','category','type']))}</td><td>${esc(objText(r,['product','item','productName']))}</td><td>${esc(objText(r,['weight','quantity','kg']))}</td><td>${esc(objText(r,['reason','note','content']))}</td><td>${esc(objText(r,['amount','price']))}</td></tr>`).join('');$('kpiBox').innerHTML=Object.entries(k||{}).filter(([x])=>x!=='year').map(([x,v])=>`<div class="k"><span>${esc(x)}</span><strong>${esc(v)}</strong></div>`).join('');$('auditBody').innerHTML=(a.rows||[]).map(r=>`<tr><td>${esc(objText(r,['date','auditDate']))}</td><td>${esc(objText(r,['type','category']))}</td><td>${esc(objText(r,['customer','client','agency','name']))}</td><td>${esc(objText(r,['content','title','note']))}</td><td>${esc(objText(r,['result','status']))}</td><td>${esc(objText(r,['nonconform','ncr','count']))}</td></tr>`).join('');const fr=fo.rows||[];$('foreignKpi').innerHTML=`<div class="k"><span>연간 발생</span><strong>${esc(fo.actual??fr.length)} 건</strong></div><div class="k"><span>목표</span><strong>${esc(fo.target??5)} 건</strong></div>`;$('foreignBody').innerHTML=fr.map(r=>`<tr><td>${esc(objText(r,['date','occurredAt']))}</td><td>${esc(objText(r,['type','category']))}</td><td>${esc(objText(r,['product','customer','item']))}</td><td>${esc(objText(r,['foreign','foreignObject','name']))}</td><td>${esc(objText(r,['content','action','note']))}</td></tr>`).join('')}load();</script></body></html>
